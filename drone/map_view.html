<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EcoScrap Live Drone Radar & Mission Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0f1d; color: #e2e8f0; overflow: hidden; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Top HUD Header */
    .hud-top {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }
    .hud-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Floating Map Controls */
    .map-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .ctrl-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* Servo Action Banner (Hero Banner) */
    .servo-banner {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      min-width: 440px;
      max-width: 92vw;
      text-align: center;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      border: 2px solid #3b82f6;
      border-radius: 16px;
      padding: 14px 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      transition: all 0.3s ease;
    }
    .servo-phase {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 800;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .servo-text {
      font-size: 16px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.2px;
    }
    .servo-sub {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 5px;
      font-family: monospace;
    }

    /* Telemetry Tele-Gauge Row */
    .hud-stats {
      position: absolute;
      top: 65px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }
    .stat-pill {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 12px;
      min-width: 140px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    .stat-val { font-size: 13px; color: #38bdf8; font-weight: 700; font-family: monospace; }

    /* Custom Drone Marker Icon */
    .drone-marker-icon {
      transition: transform 0.25s linear;
      filter: drop-shadow(0 0 12px #38bdf8);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Top Bar -->
  <div class="hud-top">
    <div class="hud-card">
      <div class="hud-title">
        <span class="live-dot"></span>
        <span>EcoScrap Autonomous Drone Radar</span>
        <span style="font-size: 10px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 8px; border-radius: 20px;" id="badge-mode">BENCH READY</span>
      </div>
    </div>
  </div>

  <!-- Floating Map Controls -->
  <div class="map-controls">
    <button class="ctrl-btn" id="btn-fit" onclick="fitMissionBounds()">📐 Fit Route</button>
    <button class="ctrl-btn active" id="btn-follow" onclick="toggleFollow()">🎯 Follow Drone</button>
  </div>

  <!-- Telemetry Gauges -->
  <div class="hud-stats">
    <div class="stat-pill">
      <span class="stat-label">Altitude</span>
      <span class="stat-val" id="val-alt">0.0 m</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">Speed</span>
      <span class="stat-val" id="val-speed">0.0 m/s</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">Heading</span>
      <span class="stat-val" id="val-heading">0°</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">Battery</span>
      <span class="stat-val" id="val-batt">100%</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">Mode</span>
      <span class="stat-val" id="val-mode">GUIDED</span>
    </div>
  </div>

  <!-- Live Servo & Mission Action Banner -->
  <div class="servo-banner" id="servo-card">
    <div class="servo-phase" id="phase-badge">MISSION STANDBY</div>
    <div class="servo-text" id="action-text">Drone on Launch Pad — Ready for Pickup Dispatch</div>
    <div class="servo-sub" id="coords-sub">Base Lat: -- | Lon: --</div>
  </div>

  <script>
    // Initialize Leaflet Map
    const map = L.map('map', { zoomControl: false }).setView([12.9821, 77.7519], 16);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Free Clean Basemaps (Zero API Keys, Zero Watermarks)
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    });

    // Default to Street Map
    osmLayer.addTo(map);

    // Layer Switcher
    L.control.layers({
      "🗺️ Street Map": osmLayer,
      "🛰️ Satellite": satelliteLayer
    }, null, { position: 'bottomright' }).addTo(map);

    // Force map to size correctly even inside iframes
    setTimeout(() => map.invalidateSize(), 300);
    setTimeout(() => map.invalidateSize(), 1200);
    window.addEventListener('resize', () => map.invalidateSize());

    // Custom Pin Creator
    const createPin = (emoji, color, bg) => L.divIcon({
      className: 'custom-pin',
      html: `<div style="background:${bg}; border: 2px solid ${color}; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer;">${emoji}</div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17]
    });

    const baseIcon   = createPin('🏠', '#22c55e', '#0f291e');
    const pickupIcon = createPin('📍', '#f59e0b', '#2d1f05');
    const depotIcon  = createPin('🏭', '#3b82f6', '#0f1f38');

    // Drone Marker SVG
    const droneSvg = `
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
        <path d="M12 2L12 7.5M12 16.5L12 22M2 12L7.5 12M16.5 12L22 12" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="5" cy="5" r="2.5" fill="#22c55e"/>
        <circle cx="19" cy="5" r="2.5" fill="#22c55e"/>
        <circle cx="5" cy="19" r="2.5" fill="#ef4444"/>
        <circle cx="19" cy="19" r="2.5" fill="#ef4444"/>
        <polygon points="12,5 15,9 9,9" fill="#ffffff"/>
      </svg>
    `;
    const droneIcon = L.divIcon({
      className: 'drone-marker-icon',
      html: `<div id="drone-rotator" style="transform-origin: center center; display: inline-block;">${droneSvg}</div>`,
      iconSize: [44, 44],
      iconAnchor: [22, 22]
    });

    let markerBase   = null;
    let markerPickup = null;
    let markerDepot  = null;
    let markerDrone  = null;
    let flightPath   = L.polyline([], { color: '#0284c7', weight: 4, opacity: 0.85, dashArray: '6, 8' }).addTo(map);
    let pathHistory  = [];
    let initialFitted = false;
    let autoFollow   = true;
    let currentLat   = 12.9821;
    let currentLon   = 77.7519;

    function toggleFollow() {
      autoFollow = !autoFollow;
      const btn = document.getElementById('btn-follow');
      if (autoFollow) {
        btn.classList.add('active');
        map.panTo([currentLat, currentLon]);
      } else {
        btn.classList.remove('active');
      }
    }

    function fitMissionBounds() {
      const markers = [];
      if (markerBase) markers.push(markerBase);
      if (markerPickup) markers.push(markerPickup);
      if (markerDepot) markers.push(markerDepot);
      if (markerDrone) markers.push(markerDrone);

      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.25));
        autoFollow = false;
        document.getElementById('btn-follow').classList.remove('active');
      }
    }

    // Telemetry Poller
    async function updateRadar() {
      try {
        const telemetryUrl = (window.location.port === '5003') ? '/telemetry' : 'http://localhost:5003/telemetry';
        const res = await fetch(telemetryUrl);
        if (!res.ok) return;
        const data = await res.json();

        const lat = data.lat || (data.base_coords ? data.base_coords.lat : 12.9821);
        const lon = data.lon || (data.base_coords ? data.base_coords.lon : 77.7519);
        currentLat = lat;
        currentLon = lon;

        const alt = data.altitude_m || 0;
        const speed = data.speed_ms || 0;
        const heading = data.heading_deg || 0;
        const batt = data.battery_pct || 100;
        const mode = data.mode || "GUIDED";
        const phase = data.mission_phase || "IDLE";
        const action = data.servo_action || "Ready on Launch Pad";

        // Update Gauges
        document.getElementById('val-alt').innerText = `${alt.toFixed(1)} m`;
        document.getElementById('val-speed').innerText = `${speed.toFixed(1)} m/s`;
        document.getElementById('val-heading').innerText = `${Math.round(heading)}°`;
        document.getElementById('val-batt').innerText = `${batt}%`;
        document.getElementById('val-mode').innerText = mode;
        document.getElementById('phase-badge').innerText = `PHASE: ${phase}`;
        document.getElementById('action-text').innerText = action;
        document.getElementById('coords-sub').innerText = `Drone: ${lat.toFixed(6)}, ${lon.toFixed(6)} | Alt: ${alt.toFixed(1)}m`;

        // Update Base Marker
        if (data.base_coords && data.base_coords.lat) {
          const bLat = data.base_coords.lat;
          const bLon = data.base_coords.lon;
          if (!markerBase) {
            markerBase = L.marker([bLat, bLon], { icon: baseIcon }).addTo(map).bindPopup("<b>Launch Base Pad</b>");
          } else {
            markerBase.setLatLng([bLat, bLon]);
          }
        }

        // Update Depot Marker
        if (data.depot_coords && data.depot_coords.lat) {
          const dLat = data.depot_coords.lat;
          const dLon = data.depot_coords.lon;
          if (!markerDepot) {
            markerDepot = L.marker([dLat, dLon], { icon: depotIcon }).addTo(map).bindPopup("<b>Recycling Collection Depot</b>");
          } else {
            markerDepot.setLatLng([dLat, dLon]);
          }
        }

        // Update Pickup Marker
        if (data.pickup_coords && data.pickup_coords.lat) {
          const pLat = data.pickup_coords.lat;
          const pLon = data.pickup_coords.lon;
          if (!markerPickup) {
            markerPickup = L.marker([pLat, pLon], { icon: pickupIcon }).addTo(map).bindPopup("<b>User Pickup Location</b>");
          } else {
            markerPickup.setLatLng([pLat, pLon]);
          }
        }

        // Update Drone Marker
        if (!markerDrone) {
          markerDrone = L.marker([lat, lon], { icon: droneIcon, zIndexOffset: 1000 }).addTo(map);
          map.setView([lat, lon], 17);
        } else {
          markerDrone.setLatLng([lat, lon]);
        }

        // Rotate Drone Marker to match compass heading
        const rotator = document.getElementById('drone-rotator');
        if (rotator) {
          rotator.style.transform = `rotate(${heading}deg)`;
        }

        // Auto camera pan if following
        if (autoFollow && (phase !== "IDLE")) {
          map.panTo([lat, lon], { animate: true, duration: 0.4 });
        }

        // Add to flight path
        if (alt > 0.5 || (phase !== "IDLE" && phase !== "COMPLETED")) {
          pathHistory.push([lat, lon]);
          flightPath.setLatLngs(pathHistory);
        }

        // Auto frame mission markers on first load
        if (!initialFitted && data.base_coords && data.pickup_coords && data.pickup_coords.lat) {
          fitMissionBounds();
          initialFitted = true;
        }

      } catch (err) {
        console.warn("Telemetry fetch error:", err);
      }
    }

    setInterval(updateRadar, 500);
    updateRadar();
  </script>
</body>
</html>
